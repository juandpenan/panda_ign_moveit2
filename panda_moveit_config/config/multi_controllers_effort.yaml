controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robot1_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    robot1_gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    robot2_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    robot2_gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

robot1_joint_trajectory_controller:
  ros__parameters:
    joints:
      - robot1_joint1
      - robot1_joint2
      - robot1_joint3
      - robot1_joint4
      - robot1_joint5
      - robot1_joint6
      - robot1_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      robot1_joint1: {p: 4000.0, d: 10.0, i: 250.0, i_clamp: 15.0}
      robot1_joint2: {p: 10000.0, d: 25.0, i: 600.0, i_clamp: 45.0}
      robot1_joint3: {p: 8000.0, d: 20.0, i: 450.0, i_clamp: 30.0}
      robot1_joint4: {p: 6000.0, d: 15.0, i: 300.0, i_clamp: 30.0}
      robot1_joint5: {p: 3000.0, d: 5.0, i: 175.0, i_clamp: 7.0}
      robot1_joint6: {p: 2500.0, d: 3.0, i: 150.0, i_clamp: 6.0}
      robot1_joint7: {p: 2000.0, d: 2.0, i: 10.0, i_clamp: 5.0}

robot1_gripper_trajectory_controller:
  ros__parameters:
    joints:
      - robot1_finger_joint1
      - robot1_finger_joint2
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      robot1_finger_joint1: {p: 225.0, d: 0.001, i: 0.4, i_clamp: 4.0}
      robot1_finger_joint2: {p: 225.0, d: 0.001, i: 0.4, i_clamp: 4.0}

