      robot2_joint3: {p: 8000.0, d: 20.0, i: 450.0, i_clamp: 30.0}
      robot2_joint4: {p: 6000.0, d: 15.0, i: 300.0, i_clamp: 30.0}
      robot2_joint5: {p: 3000.0, d: 5.0, i: 175.0, i_clamp: 7.0}
      robot2_joint6: {p: 2500.0, d: 3.0, i: 150.0, i_clamp: 6.0}
      robot2_joint7: {p: 2000.0, d: 2.0, i: 10.0, i_clamp: 5.0}

