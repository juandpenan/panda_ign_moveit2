controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robot1_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot1_gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    robot2_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot2_gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

robot1_joint_trajectory_controller:
  ros__parameters:
    joints:
      - robot1_joint1
      - robot1_joint2
      - robot1_joint3
      - robot1_joint4
      - robot1_joint5
      - robot1_joint6
      - robot1_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

robot1_gripper_trajectory_controller:
  ros__parameters:
    joints:
      - robot1_finger_joint1
      - robot1_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

robot2_joint_trajectory_controller:
  ros__parameters:
    joints:
      - robot2_joint1
      - robot2_joint2
      - robot2_joint3
      - robot2_joint4
      - robot2_joint5
      - robot2_joint6
      - robot2_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

robot2_gripper_trajectory_controller:
  ros__parameters:
    joints:
      - robot2_finger_joint1
      - robot2_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

