trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.01

# moveit_controller_manager: moveit_ros_control_interface/Ros2ControlManager
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - robot1_joint_trajectory_controller
    - robot1_gripper_trajectory_controller
    - robot2_joint_trajectory_controller
    - robot2_gripper_trajectory_controller

  robot1_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - robot1_joint1
      - robot1_joint2
      - robot1_joint3
      - robot1_joint4
      - robot1_joint5
      - robot1_joint6
      - robot1_joint7

  robot1_gripper_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - robot1_finger_joint1
      - robot1_finger_joint2

  robot2_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - robot2_joint1
      - robot2_joint2
      - robot2_joint3
      - robot2_joint4
      - robot2_joint5
      - robot2_joint6
      - robot2_joint7

  robot2_gripper_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - robot2_finger_joint1
      - robot2_finger_joint2